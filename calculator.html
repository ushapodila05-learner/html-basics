<!DOCTYPE html>
<html>
<head>
    <h1>CALCULATOR DISPLAY</h1>
    <title>CALCULATOR</title>
</head>
<body>
     <style>
.container{
display:grid;
height:300px;
  grid-template-columns: auto auto auto  auto;
background-color:lightsteelblue;
padding:5px;
gap:5px;
align-content:end;
width:70%;
}
h1{
    color:blue;
}
h3{
    color:cyan;
}

.container div{
color:white;
padding:1px;
font-size:30px;
text-align:center;
     background-color:black;
}
</style>
<h3>A simple calculator display by css</h3>
  
<div class="container">
<div style="color:blue">AC</div>
<div style="color:blue">CANCEL</div>
<div style="color:blue">+/-</div>
<div style="color:blue">÷</div>
<div>7</div>
<div>8</div>
<div>9</div>
<div  style="color:blue">x</div>
<div>4</div>
<div>5</div>
<div>6</div>
<div  style="color:blue">-</div>
<div>1</div>
<div>2</div>
<div>3</div>
<div  style="color:blue">+</div>
<div>%</div>
<div>0</div>
<div>.</div>
<div  style="color:blue">=</div>
</div>
</body>
</html>
